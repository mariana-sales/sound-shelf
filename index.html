<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Shelf</title>
</head>
<body>
   
    <!-- cabeçalho/navegação -->
    <header class="cabecalho">
        <img src="" alt="logo sound shelf">
        <h1>Sound Shelf</h1>

        <!-- navegacao principal -->
        <nav class="nav-principal">
            <a href="index.html" class="link">Home</a>
            <a href="perfil.html" class="link">Perfil</a>
            <a href="colecoes.html" class="link">Coleções</a>
        </nav>

        <!-- form de pesquisa -->
        <!-- futuramente utilizado pelo js e api -->
        <form class="form-pesquisa">

            <label for="pesquisa" class="input-estilo">
                Pesquisar
            </label>

            <input
                type="search"
                id="pesquisa"
                name="pesquisa"
                placeholder="Pesquisar">

            <button type="submit" class="botao">Buscar</button>
        </form>

        <!-- Acesso ao perfil através do avatar -->
        <a href="perfil.html" class="link-perfil">
            <img src="" alt="Foto de perfil do usuário">
        </a>
    </header>

    <!-- conteúdo principal da página -->
    <main>

        <!-- apresentação inicial-->
        <section class="apresentacao">

            <div class="conteudo-apresentacao">

                <p class="texto-pequeno">
                    BEM-VINDO AO SOUND SHELF
                </p>

                <h1>
                    Sua música, avaliada e organizada.
                </h1>

                <p>
                    Pesquise músicas, álbuns e artistas, dê suas notas,
                    escreva reviews e organize suas músicas em coleções.
                </p>

                <!-- ações principais da Home -->
                <div class="acoes-apresentacao">

                    <a href="#feed" class="botao">
                        Explorar músicas
                    </a>

                    <a href="perfil.html" class="botao-secundario">
                        Ver meu perfil
                    </a>

                </div>

            </div>

            <!-- elemento visual -->
            <div class="visual-apresentacao">

                <img src="" alt="Capas de músicas em destaque">

            </div>

        </section>

</body>
</html>
