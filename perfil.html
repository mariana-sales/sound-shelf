<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Shelf - Perfil</title>
</head>
<body>
    <!-- cabeçalho/navegação -->
    <header class="cabecalho">
        <img src="" alt="logo sound shelf">
        <p class="logo">Sound Shelf</p>

        <!-- navegacao principal -->
        <nav class="nav-principal">
            <a href="index.html" class="link">Home</a>
            <a href="perfil.html" class="link">Perfil</a>
            <a href="colecoes.html" class="link">Coleções</a>
        </nav>

        <!-- form de pesquisa -->
        <form class="form-pesquisa">

            <label for="pesquisa" class="input-estilo">
                Pesquisar
            </label>

            <input
                type="search"
                id="pesquisa"
                name="pesquisa"
                placeholder="Pesquisar">

            <button type="submit" class="botao">Buscar</button>
        </form>

        <!-- Cabeçalho do perfil -->
        <section class="cabecalho-perfil" aria-labelledby="titulo-perfil">

            <img
                src=""
                alt="Foto de perfil do usuário"
                class="avatar-grande"
            >

            <div class="informacoes-perfil">

                <h1 id="titulo-perfil">
                    Meu perfil
                </h1>

                <p class="nome-usuario">
                    @usuario
                </p>

                <p>
                    Apaixonado por música, descobrindo novos sons e
                    organizando tudo que estou ouvindo.
                </p>

                <!-- Estatísticas resumidas do perfil -->
                <div class="estatisticas-perfil">

                    <div>
                        <strong>48</strong>
                        <span>Avaliações</span>
                    </div>

                    <div>
                        <strong>17</strong>
                        <span>Reviews</span>
                    </div>

                    <div>
                        <strong>6</strong>
                        <span>Coleções</span>
                    </div>

                </div>

            </div>

        </section>

    </main>
</body>
</html>
