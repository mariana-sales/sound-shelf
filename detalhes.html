<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Shelf</title>
</head>
<body>
    <!-- cabeçalho/navegação -->
    <header class="cabecalho">
        <img src="" alt="logo sound shelf">
        <p class="logo">Sound Shelf</p>

        <!-- navegacao principal -->
        <nav class="nav-principal">
            <a href="index.html" class="link">Home</a>
            <a href="perfil.html" class="link">Perfil</a>
            <a href="colecoes.html" class="link">Coleções</a>
        </nav>

        <!-- form de pesquisa -->
        <form class="form-pesquisa">

            <label for="pesquisa" class="input-estilo">
                Pesquisar
            </label>

            <input
                type="search"
                id="pesquisa"
                name="pesquisa"
                placeholder="Pesquisar">

            <button type="submit" class="botao">Buscar</button>
        </form>
    </header>

    <!-- Conteúdo principal da página -->
    <main>

        <!-- Informações principais do conteúdo -->
        <section
            class="detalhes-conteudo""
        >

            <!-- Capa do álbum -->
            <div class="capa-detalhes">

                <img
                    src=""
                    alt="Capa do álbum"
                    id="capa-conteudo"
                >

            </div>

            <!-- Informações do álbum -->
            <div class="informacoes-detalhes">

                <p class="texto-pequeno" id="tipo-conteudo">
                    ÁLBUM
                </p>

                <h1 id="titulo-conteudo">
                    After Hours
                </h1>

                <p class="artista-conteudo">
                    Por
                    <a href="#" class="link" id="nome-artista">
                        The Weeknd
                    </a>
                </p>

                <div class="metadados-conteudo">

                    <span id="ano-lancamento">
                        2020
                    </span>

                    <span>•</span>

                    <span id="genero-conteudo">
                        R&B / Pop
                    </span>

                </div>

                <!-- Avaliação geral do conteúdo -->
                <div class="avaliacao">

                    <span>★</span>

                    <span id="nota-media">
                        4,8
                    </span>

                    <span id="quantidade-avaliacoes">
                        (1.250 avaliações)
                    </span>

                </div>

                <!-- Ações principais do usuário -->
                <div class="acoes-conteudo">

                    <button
                        type="button"
                        class="botao"
                        id="botao-avaliar"
                    >
                        Avaliar
                    </button>

                    <button
                        type="button"
                        class="botao-secundario"
                        id="botao-favorito"
                    >
                        Adicionar aos favoritos
                    </button>

                    <button
                        type="button"
                        class="botao-secundario"
                        id="botao-adicionar-colecao"
                    >
                        Adicionar à coleção
                    </button>

                </div>

            </div>

        </section>

</body>
</html>
