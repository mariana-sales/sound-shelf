<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Shelf - Login</title>
</head>
<body>
    <!-- cabeçalho/navegação -->
    <header class="cabecalho">
        <img src="" alt="logo sound shelf">
        <p class="logo">Sound Shelf</p>

        <!-- navegacao principal -->
        <nav class="nav-principal">
            <a href="index.html" class="link">Home</a>
            <a href="perfil.html" class="link">Perfil</a>
            <a href="colecoes.html" class="link">Coleções</a>
        </nav>

        <!-- form de pesquisa -->
        <form class="form-pesquisa">

            <label for="pesquisa" class="input-estilo">
                Pesquisar
            </label>

            <input
                type="search"
                id="pesquisa"
                name="pesquisa"
                placeholder="Pesquisar">

            <button type="submit" class="botao">Buscar</button>
        </form>
    </header>
    
     <!-- Formulário de login -->

    <main>

        <section
            class="secao-autenticacao"
        >

            <header class="cabecalho-secao">

                <p class="texto-pequeno">BEM-VINDO DE VOLTA</p>

                <h1 id="titulo-login">Entre na sua conta</h1>

                <p>
                    Acesse sua biblioteca e continue compartilhando
                    suas experiências musicais.
                </p>

            </header>

            <form id="formulario-login">

                <!-- Campo de e-mail -->

                <div class="campo-formulario">

                    <label for="email-login">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email-login"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        required
                    >

                </div>

                <!-- Campo de senha -->

                <div class="campo-formulario">

                    <label for="senha-login">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha-login"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <!-- Opções adicionais -->

                <div class="opcoes-login">

                    <label for="lembrar-login">

                        <input
                            type="checkbox"
                            id="lembrar-login"
                            name="lembrar"
                        >

                        Manter conectado

                    </label>

                    <a href="#" class="link">
                        Esqueci minha senha
                    </a>

                </div>

                <!-- Botão de envio -->

                <button type="submit" class="botao">
                    Entrar
                </button>

            </form>

            <!-- Link para cadastro -->

            <p class="texto-autenticacao">
                Ainda não tem uma conta?

                <a href="cadastro.html" class="link">
                    Cadastre-se
                </a>
            </p>

        </section>

    </main>

    <!-- Rodapé padrão -->

    <footer class="rodape">

        <p>Projeto acadêmico</p>

        <p>&copy; 2026 Sound Shelf</p>

    </footer>
    
</body>
</html>
